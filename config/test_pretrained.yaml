name: test_pretrained
mode: test
gpu_id: 0  # only support single GPU
random_seed: 0
experiment_data_dir: experiment_data

network:
  input_feature:
    pos:
      num_pe_freqs: 6
    normal:
      num_pe_freqs: 6

  graph_unet:  # geometry encoder
    knn: 6
    depth: 6
    num_res_blocks_per_layer: 2
    out_channels: 256

  sub_graph_unet:  # seed encoder
    knn: 6
    depth: 6
    in_channels: 256
    out_channels: 256
    num_res_blocks_per_layer: 3

  mlp:  # seed decoder
    num_layers: 4
    hidden_channels: 256

  gru:
    hidden_channels: 256
    use_proj_feature: True
    concat_pos: True

test:
  checkpoint:
    dir:
      1: ${experiment_data_dir}/checkpoints/pretrained_model/stage1
      2: ${experiment_data_dir}/checkpoints/pretrained_model/stage2
      3: ${experiment_data_dir}/checkpoints/pretrained_model/stage3
    epoch: {1: -1, 2: -1, 3: -1}  # -1 means the latest checkpoint
  batch_size: 8
  num_workers: 4
  size_pc: 50000  # size of discrete point cloud
  num_seeds: 1000
  num_iters: {1: 20, 2: 10, 3: 5}
  project_seeds: False  # whether to project the optimized seeds onto the mesh surface
  test_mesh_dir: ${experiment_data_dir}/test_mesh/samples
  output_dir: ${experiment_data_dir}/output
  geogram_path: geogram/build

hydra:  
  job:
    chdir: false
  run:
    dir: .

defaults:  
  - override hydra/job_logging: disabled